[package]
name = "anime-hub-desktop"
version = "0.1.0"
description = "Anime Hub desktop wrapper — hub lifecycle + dedicated-profile Chromium app window"
edition = "2021"

[dependencies]
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
