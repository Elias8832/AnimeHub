# Every push: the whole suite on real Windows and on Linux, the real mpv tests,
# and the Windows zip (TODO 148). Download the zip from the run's Artifacts.
# A green push to master also builds the AppImage and publishes both to the
# rolling "unstable" release, the Unstable update channel (Decision 76).
name: Tests

on:
  push:
    paths-ignore:
      - "README.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The Windows suite is slow (about 7 min in one job), so it runs in
  # parallel: the real mpv tests in their own job (the only one that needs
  # mpv and FFmpeg, about a minute to install), the rest in 4 jobs split by
  # time (.github/split_tests.py). The zip builds alongside.
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: ["real", 0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install mpv and FFmpeg
        if: matrix.shard == 'real'
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\scoop.ps1"
          & "$env:RUNNER_TEMP\scoop.ps1" -RunAsAdmin
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add extras
          scoop install extras/mpv ffmpeg
          "$env:USERPROFILE\scoop\shims" >> $env:GITHUB_PATH
          "$env:USERPROFILE\scoop\apps\mpv\current" >> $env:GITHUB_PATH
      - name: Tests
        shell: bash
        env:
          ANIME_HUB_REAL_TOOLS: "1"
        run: |
          if [ "${{ matrix.shard }}" = real ]; then
            python -m unittest --durations 10 tests.test_real_tools
            exit
          fi
          files=$(python .github/split_tests.py ${{ matrix.shard }} 4)
          echo "$files"
          python -m unittest --durations 10 $files

  windows-zip:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Stamp the build
        shell: bash
        run: .github/stamp.sh
      - name: Build the zip
        run: powershell -ExecutionPolicy Bypass -File desktop\windows\build.ps1
      - name: Check the zip
        run: python desktop\windows\smoke.py
      - uses: actions/upload-artifact@v7
        with:
          path: desktop/target/AnimeHub-windows-x64.zip
          archive: false
          retention-days: 30

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest

  appimage:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Stamp the build
        run: .github/stamp.sh
      - name: Build the AppImage
        env:
          # appimagetool is an AppImage itself; the runner has no FUSE.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: desktop/appimage/build.sh
      - uses: actions/upload-artifact@v7
        with:
          path: desktop/target/AnimeHub-x86_64.AppImage
          archive: false
          retention-days: 30

  # Only after everything is green: a red build never reaches Unstable.
  unstable:
    needs: [windows, windows-zip, linux, appimage]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: unstable-release
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: AnimeHub-x86_64.AppImage
          path: out
      - uses: actions/download-artifact@v8
        with:
          name: AnimeHub-windows-x64.zip
          path: out
      - name: Publish to the unstable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/publish-unstable.sh out/AnimeHub-x86_64.AppImage out/AnimeHub-windows-x64.zip
